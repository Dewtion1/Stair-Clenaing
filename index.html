<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#143327">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stair Cleaning">
<meta name="description" content="An Edinburgh stair-cleaning game for the family. Mop the muck, dodge the bikes, get paid.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Stair Cleaning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@500;700;900&display=swap">
<style>[hidden]{display:none!important}img{max-width:100%}</style>

<body>



<style>
/* Layout: one-screen phone app. Edinburgh close — sandstone stair, bottle-green tiled walls, brass nameplates. Single deliberate look. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --stone:#c9b89a; --stone-deep:#8f7f63; --tile:#1f4d3a; --tile-deep:#143327;
  --cream:#f3ecdb; --ink:#1c1813; --brass:#d4a645; --red:#d9483a; --muck:#5a4630; --cash:#3fa66b;
  --display:'Alfa Slab One', 'Rockwell', 'Georgia', serif;
  --body:'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{margin:0;background:var(--tile-deep);color:var(--cream);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
.screen{display:flex;flex-direction:column;gap:14px;height:100%;min-height:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,11vw,3.6rem);line-height:.95;margin:0;color:var(--brass);text-shadow:0 3px 0 var(--tile-deep),0 4px 0 #000;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;color:var(--brass);text-wrap:balance}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-weight:700}
p{margin:0;line-height:1.45}
.muted{color:var(--stone);font-size:.9rem}
button{font:inherit;font-weight:900;border:0;border-radius:6px;padding:14px 18px;cursor:pointer;color:var(--ink);background:var(--brass);box-shadow:0 3px 0 #7a5a1c;font-size:1.05rem}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5a1c}
button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
button.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--stone-deep)}
button.ghost:active{box-shadow:inset 0 0 0 2px var(--stone-deep)}
button:disabled{opacity:.45;cursor:default}
.plate{background:var(--tile);border:2px solid var(--stone-deep);border-radius:8px;padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.scroll{overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}

/* roster */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.card{background:var(--tile);border:2px solid var(--stone-deep);border-radius:8px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--cream);box-shadow:none;font-weight:700;font-size:.9rem}
.card.sel{border-color:var(--brass);background:#2a6349}
.card .av{width:64px;height:64px;border-radius:50%;background:var(--stone);background-size:cover;background-position:center;border:3px solid var(--cream);display:grid;place-items:center;font-size:1.8rem}
.card small{color:var(--stone);font-weight:500;font-size:.75rem}
.lvl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;padding:12px 14px;background:var(--tile);color:var(--cream);box-shadow:none;border:2px solid var(--stone-deep);border-radius:8px}
.lvl b{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--brass)}
.lvl.lock{opacity:.5}
.lvl .best{grid-row:span 2;font-variant-numeric:tabular-nums;color:var(--cash);font-weight:900;font-size:.95rem;text-align:right}
input[type=text]{font:inherit;font-size:1rem;padding:12px;border-radius:6px;border:2px solid var(--stone-deep);background:var(--tile-deep);color:var(--cream);width:100%;box-sizing:border-box}
input[type=text]:focus-visible{outline:3px solid var(--brass);outline-offset:1px}
label.file{display:flex;align-items:center;gap:12px;cursor:pointer}
label.file input{position:absolute;opacity:0;width:1px;height:1px}
label.file .prev{width:72px;height:72px;border-radius:50%;background:var(--stone);background-size:cover;background-position:center;border:3px solid var(--cream);display:grid;place-items:center;font-size:2rem;flex:none}
.faces{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.face{aspect-ratio:1;max-width:100%;padding:0;border-radius:50%;background-size:cover;background-position:center;border:3px solid var(--stone-deep);box-shadow:none}
.face.sel{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass)}
label.file span.btn{display:inline-block;background:var(--brass);color:var(--ink);padding:10px 14px;border-radius:6px;font-weight:900;box-shadow:0 3px 0 #7a5a1c}

/* legend */
.legend{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;font-size:.8rem;font-weight:700}
.legend div{background:var(--tile-deep);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.legend .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem}
.ic.mop{background:#7a6240}
.ic.dodge{box-shadow:0 0 0 3px var(--red);background:#2b1d1a}
.ic.cash{box-shadow:0 0 0 3px var(--cash);background:#163a28}

/* game */
#game{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#cv{width:100%;flex:1;min-height:0;border-radius:8px;border:3px solid var(--stone-deep);display:block;touch-action:none;background:var(--stone)}
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:6px 2px;font-variant-numeric:tabular-nums}
#hud .t{font-family:var(--display);font-size:2rem;color:var(--brass);text-align:center;line-height:1}
#hud .t.low{color:var(--red)}
#hud .l{font-size:.85rem;line-height:1.3}
#hud .r{text-align:right;font-size:.85rem;line-height:1.3}
#hud .cash{color:var(--cash);font-weight:900;font-size:1.25rem}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,51,39,.8);border-radius:8px}
#over.on{display:flex}
#over .plate{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
.big{font-family:var(--display);font-size:2.5rem;color:var(--brass);line-height:1}
.money{font-family:var(--display);font-size:3.2rem;color:var(--cash);line-height:1;font-variant-numeric:tabular-nums}
.hint{text-align:center;color:var(--stone);font-size:.8rem}
#mixcv{width:100%;flex:1;min-height:0;border-radius:8px;border:3px solid var(--stone-deep);display:block;touch-action:none;background:#2e2a24}
.step{font-weight:900;text-align:center;font-size:1.05rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div id="app"></div>

// ---------- persistence ----------
const KEY='staircleaning.v1';
let S={players:[],current:null};
try{const raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const cur=()=>S.players.find(p=>p.id===S.current)||null;
const gbp=n=>'£'+Math.round(n);

// ---------- levels ----------
const LEVELS=[

// ---------- tiny audio ----------
let AC=null;
function beep(f,d,type){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}

// ---------- UI helpers ----------
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const avStyle=p=>p.photo?`background-image:url(${p.photo})`:'';
const avFace=p=>p.photo?'':'🧹';
const LEGEND=`<div class="legend"><div><div class="ic mop">🟤</div>Mop the muck</div><div><div class="ic dodge">🚲</div>Dodge red rings</div><div><div class="ic cash">💷</div>Grab the cash</div></div>`;

// ---------- HOME ----------
function home(){
  stopGame();
  const me=cur();
  app.innerHTML=`<div class="screen">
    <div>
      <div class="eyebrow">An Edinburgh stair-cleaning game</div>
      <h1>Stair Cleaning</h1>
      <p class="muted">Mop the muck. Dodge the bikes. Get paid.</p>
    </div>
    <div class="scroll">
      <div class="row"><h2 class="grow">Who's on the stair?</h2>${me?`<button class="ghost" id="edit" style="padding:10px 14px">Edit</button>`:''}<button class="ghost" id="add" style="padding:10px 14px">+ Add cleaner</button></div>
      <div class="cards" id="cards">${S.players.map(p=>`<button class="card ${p.id===S.current?'sel':''}" data-id="${p.id}"><div class="av" style="${avStyle(p)}">${avFace(p)}</div><div>${esc(p.name)}</div><small>Earned ${gbp(bestTotal(p))}</small></button>`).join('')||'<p class="muted" style="grid-column:1/-1">Nobody yet. Add a cleaner and put their face on it.</p>'}</div>
    </div>
    <button id="play" ${me?'':'disabled'}>${me?'Pick a stair, '+esc(me.name.split(' ')[0]):'Add a cleaner to start'}</button>

// ---------- MIX THE BUCKET (mini game) ----------
let M=null;
function mixScreen(i){
  stopGame();
  const L=LEVELS[i];
  app.innerHTML=`<div class="screen" style="gap:8px">
    <div class="row"><div class="grow"><div class="eyebrow">${esc(L.name)}</div><h2>Mix the bucket</h2></div><button class="ghost" id="back" style="padding:10px 14px">Back</button></div>
    <div class="step" id="stepTxt">Hold the bucket to pour <span style="color:#5fd0c8">fluid</span>. Stop in the green band.</div>
    <canvas id="mixcv"></canvas>
    <button id="go" disabled>Pour first</button>
  </div>`;
  app.querySelector('#back').onclick=levels;
  const cv=app.querySelector('#mixcv'),ctx=cv.getContext('2d');
  M={i,cv,ctx,fluid:0,water:0,stage:0,hold:false,stir:0,rating:null,last:performance.now(),swirl:0};
  cv.onpointerdown=()=>{if(M.stage<2)M.hold=true;AC||beep(440,.01);};
  const up=()=>{if(!M||!M.hold)return;M.hold=false;if(M.stage===0){M.stage=1;app.querySelector('#stepTxt').innerHTML='Now hold to pour <span style="color:#8fc3ff">water</span>. Fill to the line.';}else if(M.stage===1){M.stage=2;rate();}};
  cv.onpointerup=up;cv.onpointercancel=up;cv.onpointerleave=up;
  raf=requestAnimationFrame(mixTick);
}
function rate(){
  const f=M.fluid,w=M.fluid+M.water;
  const fOk=f>=.18&&f<=.28,wOk=w>=.82&&w<=.95;
  let r;
  if(fOk&&wOk)r={label:'Perfect mix',mult:1.5,msg:'Customers pay a wee bit extra for that.'};
  else if((fOk||wOk)&&w>=.6&&f>=.08)r={label:'Decent mix',mult:1,msg:'That\'ll get the job done.'};
  else if(f>.28&&w>=.6)r={label:'Too strong',mult:.75,msg:'Whole stair stinks of bleach. Pay docked.'};
  else r={label:'Weak as dishwater',mult:.5,msg:'The muck\'s laughing at you. Pay docked.'};
  M.rating=r;
  const txt=app.querySelector('#stepTxt');txt.innerHTML=`<span style="color:var(--brass)">${r.label}</span> — ${r.msg} Pay ×${r.mult}`;
  const go=app.querySelector('#go');go.disabled=false;go.textContent='Right, mop it';go.onclick=()=>startLevel(M.i,r);
  app.querySelector('#back').textContent='Remix';app.querySelector('#back').onclick=()=>mixScreen(M.i);
  beep(fOk&&wOk?784:330,.2,'triangle');
}
function mixTick(now){
  if(!M)return;const m=M,dt=Math.min(.05,(now-m.last)/1000);m.last=now;
  if(m.hold){if(m.stage===0)m.fluid=Math.min(1,m.fluid+.28*dt);else if(m.stage===1)m.water=Math.min(1-m.fluid,m.water+.45*dt);}
  m.swirl+=dt;
  const cv=m.cv,dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const ctx=m.ctx;ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#2e2a24';ctx.fillRect(0,0,W,H);
  // floor tiles
  ctx.strokeStyle='rgba(255,255,255,.06)';for(let y=H*.75;y<H;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // bucket geometry
  const bw=Math.min(W*.5,220),bh=Math.min(H*.55,300),bx=W/2,top=H*.22,bot=top+bh;
  const lx=t=>bx-bw/2*(1-.12*t),rx=t=>bx+bw/2*(1-.12*t); // narrower at bottom
  // contents
  const total=m.fluid+m.water;
  function fillBand(from,to,col){ if(to<=from)return;const y1=bot-bh*to,y2=bot-bh*from;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(lx(to),y1);ctx.lineTo(rx(to),y1);ctx.lineTo(rx(from),y2);ctx.lineTo(lx(from),y2);ctx.closePath();ctx.fill();}
  if(m.stage<2){fillBand(0,m.fluid,'#2fa39a');fillBand(m.fluid,total,'#5b9be0');}
  else{const mixc=m.rating.mult>=1.5?'#4ec3b9':m.rating.mult>=1?'#5aa6c9':m.rating.mult>=.75?'#1f8f85':'#8fb5d8';fillBand(0,total,mixc);
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;for(let k=0;k<3;k++){ctx.beginPath();for(let a=0;a<Math.PI*2;a+=.2){const r=bw*.18*(k+1)/3;ctx.lineTo(bx+Math.cos(a+m.swirl*2+k)*r,bot-bh*total*.5+Math.sin(a+m.swirl*2+k)*r*.3);}ctx.closePath();ctx.stroke();}}
  // bubbles
  if(total>0){ctx.fillStyle='rgba(255,255,255,.35)';for(let k=0;k<8;k++){const ph=(m.swirl*.4+k*.37)%1;ctx.beginPath();ctx.arc(bx+Math.sin(k*2.1)*bw*.3,bot-bh*total*ph,2+k%3,0,7);ctx.fill();}}
  // bucket outline
  ctx.strokeStyle='#c9c9c9';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(lx(1),top);ctx.lineTo(lx(0),bot);ctx.lineTo(rx(0),bot);ctx.lineTo(rx(1),top);ctx.stroke();
  ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(bx,top,bw/2,10,0,0,Math.PI*2);ctx.stroke();
  // handle
  ctx.strokeStyle='#9a9a9a';ctx.lineWidth=5;ctx.beginPath();ctx.arc(bx,top,bw/2+6,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
  // guides
  const band=(a,b,col,label)=>{const y1=bot-bh*b,y2=bot-bh*a;ctx.fillStyle=col;ctx.fillRect(rx(1)+14,y1,10,y2-y1);ctx.fillStyle='#f3ecdb';ctx.font='700 12px Nunito, sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(label,rx(1)+30,(y1+y2)/2);};
  band(.18,.28,'rgba(63,166,107,.9)','fluid');band(.82,.95,'rgba(143,195,255,.9)','water line');
  // pouring bottle
  if(m.hold&&m.stage<2){const col=m.stage===0?'#2fa39a':'#5b9be0';ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(bx-8,top-14);ctx.lineTo(bx+8,top-14);ctx.lineTo(bx+3,bot-bh*total);ctx.lineTo(bx-3,bot-bh*total);ctx.closePath();ctx.fill();
    ctx.font='40px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';ctx.textAlign='center';ctx.fillText(m.stage===0?'🧴':'🚰',bx+bw*.45,top-40);}
  // level readout
  ctx.fillStyle='#f3ecdb';ctx.font='900 14px Nunito, sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText(`Fluid ${Math.round(m.fluid*100)}%  ·  Water ${Math.round(m.water*100)}%`,W/2,bot+34);
  raf=requestAnimationFrame(mixTick);
}

// ---------- GAME ----------
let G=null,raf=0;
function stopGame(){if(raf)cancelAnimationFrame(raf);raf=0;G=null;M=null;window.onkeydown=null;}

function startLevel(i,mix){
  stopGame();
  const me=cur(),L=LEVELS[i];mix=mix||{label:'Decent mix',mult:1};
  app.innerHTML=`<div class="screen" style="gap:6px">
    <div id="hud"><div class="l"><b style="color:var(--brass)">${esc(L.name)}</b><br><span id="lives"></span></div><div class="t" id="time"></div><div class="r"><span class="cash" id="cash">£0</span><br>mopped <b id="swept"></b>/${L.target}</div></div>
    <div id="game"><canvas id="cv"></canvas><div id="over"></div></div>
  </div>`;
  const cv=app.querySelector('#cv'),ctx=cv.getContext('2d');
  const photo=new Image();if(me.photo)photo.src=me.photo;
  G={L,i,me,cv,ctx,photo,mix,lane:1,x:0,t:L.time,swept:0,cash:0,lives:3,objs:[],parts:[],wet:[],toasts:[],spawnT:0,inv:0,last:0,done:false,steps:0,shake:0,mop:0,
     hud:{time:app.querySelector('#time'),swept:app.querySelector('#swept'),lives:app.querySelector('#lives'),cash:app.querySelector('#cash')}};
  let sx=null;
  cv.onpointerdown=e=>{sx=e.clientX;AC||beep(440,.01);};
  cv.onpointerup=e=>{if(sx===null||!G||G.done)return;const dx=e.clientX-sx;if(Math.abs(dx)>24)move(dx>0?1:-1);else move(e.clientX<cv.getBoundingClientRect().left+cv.clientWidth/2?-1:1);sx=null;};
  window.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);};
  function move(d){if(!G||G.done)return;G.lane=Math.max(0,Math.min(2,G.lane+d));beep(G.lane===1?330:300,.04,'triangle');}
  G.last=performance.now();
  raf=requestAnimationFrame(tick);
}
function pickCash(){const r=Math.random();let a=0;for(const c of CASH){a+=c.w;if(r<a)return c;}return CASH[0];}

function tick(now){
  if(!G)return;
  const g=G,L=g.L,dt=Math.min(.05,(now-g.last)/1000);g.last=now;
  const cv=g.cv,dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const ctx=g.ctx;ctx.setTransform(dpr,0,0,dpr,0,0);
  const wall=Math.max(28,W*.1),laneW=(W-wall*2)/3,laneX=l=>wall+laneW*(l+.5),py=H*.78;

  if(!g.done){
    g.t-=dt;g.steps=(g.steps+L.speed*dt)%56;g.spawnT-=dt;g.inv=Math.max(0,g.inv-dt);g.shake=Math.max(0,g.shake-dt);g.mop=Math.max(0,g.mop-dt);
    if(g.spawnT<=0){g.spawnT=L.spawn*(0.7+Math.random()*.6);const r=Math.random(),lane=Math.floor(Math.random()*3);
      if(r<.12){const c=pickCash();g.objs.push({k:c.k,v:c.v,lane,y:-40,cash:true,who:c.who?NEIGHBOURS[Math.floor(Math.random()*NEIGHBOURS.length)]:null});}
      else if(r<.45){const blocked=g.objs.filter(o=>o.bad&&o.y<40).length;if(blocked<2)g.objs.push({k:L.obs[Math.floor(Math.random()*L.obs.length)],lane,y:-40,bad:true});}
      else g.objs.push({lane,y:-40,dirt:true,seed:Math.random()});
    }
    for(const o of g.objs){o.y+=L.speed*dt;
      if(!o.hit&&o.lane===g.lane&&Math.abs(o.y-py)<30){
        if(o.dirt){o.hit=true;g.swept++;g.mop=.35;beep(660,.08,'triangle');puff(laneX(o.lane),py,'#7a6240');g.wet.push({lane:o.lane,y:o.y,life:1});}
        else if(o.cash){o.hit=true;const v=Math.round(o.v*g.mix.mult);g.cash+=v;beep(880,.12,'sine');puff(laneX(o.lane),py,'#3fa66b');g.toasts.push({x:laneX(o.lane),y:py-50,txt:(o.who?o.who+' · ':'')+'+'+gbp(v),life:1.2});}
        else if(o.bad&&g.inv<=0){o.hit=true;g.lives--;g.inv=1.3;g.shake=.3;beep(110,.25,'sawtooth');}
      }}
    g.objs=g.objs.filter(o=>o.y<H+60&&!(o.hit&&!o.bad));
    for(const w of g.wet){w.y+=L.speed*dt;}g.wet=g.wet.filter(w=>w.y<H+80);
    for(const p of g.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt;}g.parts=g.parts.filter(p=>p.life>0);
    for(const t of g.toasts){t.y-=30*dt;t.life-=dt;}g.toasts=g.toasts.filter(t=>t.life>0);
    if(g.swept>=L.target)finish(true);else if(g.t<=0||g.lives<=0)finish(false);
  }

  // ---- draw ----
  ctx.save();if(g.shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  ctx.fillStyle=L.stone;ctx.fillRect(0,0,W,H);
  for(let y=-56+g.steps;y<H+56;y+=56){
    ctx.fillStyle='rgba(0,0,0,.10)';ctx.fillRect(wall,y,W-wall*2,8);
    ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(wall,y+8,W-wall*2,3);
    ctx.fillStyle='rgba(0,0,0,.04)';ctx.fillRect(wall,y+30,W-wall*2,26);
  }
  // mopped, shining patches
  for(const w of g.wet){const x=laneX(w.lane);ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(x,w.y,laneW*.42,22,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(120,170,220,.5)';ctx.lineWidth=2;for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(x-laneW*.3,w.y+k*9);ctx.quadraticCurveTo(x,w.y+k*9-6,x+laneW*.3,w.y+k*9);ctx.stroke();}
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✦',x+laneW*.28,w.y-10);}
  ctx.strokeStyle='rgba(0,0,0,.07)';ctx.setLineDash([6,10]);ctx.lineWidth=1;for(let l=1;l<3;l++){ctx.beginPath();ctx.moveTo(wall+laneW*l,0);ctx.lineTo(wall+laneW*l,H);ctx.stroke();}ctx.setLineDash([]);
  ctx.fillStyle=L.wall;ctx.fillRect(0,0,wall,H);ctx.fillRect(W-wall,0,wall,H);
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;for(let y=-20+g.steps%20;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(wall,y);ctx.moveTo(W-wall,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle='#6b4a2a';ctx.fillRect(wall-6,0,6,H);ctx.fillRect(W-wall,0,6,H);
  // objects
  ctx.textAlign='center';ctx.textBaseline='middle';
  const EM='px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
  for(const o of g.objs){const x=laneX(o.lane);
    if(o.dirt){ // brown muck puddle — always the same shape so it reads as "mop me"
      ctx.fillStyle='#5a4630';ctx.globalAlpha=.9;ctx.beginPath();for(let a=0;a<8;a++){const ang=a/8*Math.PI*2,r=16+Math.sin(o.seed*9+a*3)*5;ctx.lineTo(x+Math.cos(ang)*r*1.5,o.y+Math.sin(ang)*r*.7);}ctx.closePath();ctx.fill();
      ctx.fillStyle='#3b2c1c';ctx.beginPath();ctx.arc(x-8,o.y-2,4,0,7);ctx.arc(x+7,o.y+4,3,0,7);ctx.fill();ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(90,70,48,.6)';ctx.lineWidth=1.5;for(let k=0;k<3;k++){const wx=x-10+k*10,ph=Math.sin(now/300+k);ctx.beginPath();ctx.moveTo(wx,o.y-12);ctx.quadraticCurveTo(wx+4*ph,o.y-20,wx,o.y-28);ctx.stroke();}
    }else if(o.bad){ // red warning ring
      ctx.fillStyle='rgba(217,72,58,.18)';ctx.beginPath();ctx.arc(x,o.y,28,0,7);ctx.fill();
      ctx.strokeStyle='#d9483a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,o.y,28,0,7);ctx.stroke();
      ctx.font='32'+EM;ctx.fillText(o.k,x,o.y+1);
    }else if(o.cash){ // green cash ring
      ctx.fillStyle='rgba(63,166,107,.25)';ctx.beginPath();ctx.arc(x,o.y,26,0,7);ctx.fill();
      ctx.strokeStyle='#3fa66b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,o.y,26,0,7);ctx.stroke();
      ctx.font='28'+EM;ctx.fillText(o.k,x,o.y+1);
      ctx.fillStyle='#f3ecdb';ctx.font='900 12px Nunito, sans-serif';ctx.fillText(gbp(o.v),x,o.y+38);
    }
  }
  for(const p of g.parts){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);}ctx.globalAlpha=1;
  // player
  g.x+= (laneX(g.lane)-(g.x||laneX(g.lane)))*Math.min(1,dt*16);if(!g.x)g.x=laneX(g.lane);
  if(g.inv<=0||Math.floor(now/80)%2===0)drawPlayer(ctx,g.x,py,g.photo,g.me.photo,g.mop);
  // toasts
  for(const t of g.toasts){ctx.globalAlpha=Math.min(1,t.life);ctx.fillStyle='#3fa66b';ctx.font='900 15px Nunito, sans-serif';ctx.textAlign='center';ctx.fillText(t.txt,Math.min(W-wall-10,Math.max(wall+10,t.x)),t.y);}ctx.globalAlpha=1;
  ctx.restore();

  g.hud.time.textContent=Math.max(0,Math.ceil(g.t));g.hud.time.classList.toggle('low',g.t<10);
  g.hud.swept.textContent=g.swept;g.hud.cash.textContent=gbp(g.cash);
  g.hud.lives.textContent='❤️'.repeat(Math.max(0,g.lives))+'🖤'.repeat(3-Math.max(0,g.lives));
  raf=requestAnimationFrame(tick);
}
function puff(x,y,c){for(let i=0;i<10;i++)G.parts.push({x,y,vx:(Math.random()-.5)*220,vy:-Math.random()*220,life:.5,c});}

function drawPlayer(ctx,x,y,img,hasPhoto,mop){
  // mop: swings across the step when mopping
  const swing=mop>0?Math.sin((0.35-mop)/0.35*Math.PI)*1.1:0;
  ctx.save();ctx.translate(x+14,y-6);ctx.rotate(0.5-swing);
  ctx.strokeStyle='#8b5a2b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,46);ctx.stroke();
  ctx.fillStyle='#e8e2d2';ctx.beginPath();ctx.moveTo(-10,42);ctx.lineTo(10,42);ctx.lineTo(13,58);ctx.lineTo(-13,58);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#cfc6b2';ctx.lineWidth=1.5;for(let k=-9;k<=9;k+=3){ctx.beginPath();ctx.moveTo(k,44);ctx.lineTo(k*1.3,58);ctx.stroke();}
  ctx.restore();
  // legs + overalls
  ctx.fillStyle='#1b2a44';ctx.fillRect(x-12,y+24,9,16);ctx.fillRect(x+3,y+24,9,16);
  ctx.fillStyle='#2a4b8d';ctx.beginPath();ctx.moveTo(x-16,y-2);ctx.lineTo(x+16,y-2);ctx.lineTo(x+14,y+28);ctx.lineTo(x-14,y+28);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e4b23a';ctx.fillRect(x-16,y+8,32,5);
  // head
  const r=24,hy=y-22;
  ctx.save();ctx.beginPath();ctx.arc(x,hy,r,0,Math.PI*2);ctx.closePath();ctx.fillStyle='#f0c9a0';ctx.fill();ctx.clip();
  if(hasPhoto&&img.complete&&img.naturalWidth)ctx.drawImage(img,x-r,hy-r,r*2,r*2);
  else{ctx.fillStyle='#1c1813';ctx.beginPath();ctx.arc(x-8,hy-4,2.5,0,7);ctx.arc(x+8,hy-4,2.5,0,7);ctx.fill();ctx.strokeStyle='#1c1813';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,hy+4,8,.2,Math.PI-.2);ctx.stroke();}
  ctx.restore();
  ctx.strokeStyle='#f3ecdb';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,hy,r,0,Math.PI*2);ctx.stroke();
}

function finish(win){
  const g=G,me=g.me,L=g.L;g.done=true;
  const tip=win?Math.ceil(g.t):0; // £1 per second left: the neighbours tip a quick job
  const total=g.cash+tip;
  let newBest=false;
  if(win){if(!me.best[g.i]||total>me.best[g.i]){me.best[g.i]=total;newBest=true;}me.unlocked=Math.max(me.unlocked,Math.min(LEVELS.length,g.i+2));save();}
  if(win){beep(523,.15,'triangle');setTimeout(()=>beep(784,.3,'triangle'),140);}
  const last=g.i===LEVELS.length-1;
  const lines=win?['Aye, that\'ll do.','Stair\'s gleaming.','Ya dancer!','No bad at all.']:[g.lives<=0?'Ach, ye got flattened.':'Time\'s up, hen.','The neighbours are no happy.'];
  const o=app.querySelector('#over');
  o.innerHTML=`<div class="plate">
    <div class="eyebrow">${esc(L.name)} · ${esc(g.mix.label)}</div>
    <div class="big">${win?(last?'Stair heid!':'Clean!'):'Back up ye go'}</div>
    <p>${lines[Math.floor(Math.random()*lines.length)]}</p>
    <div class="eyebrow">${win?'Collected':'Collected before ye stopped'}</div>
    <div class="money">${gbp(win?total:g.cash)}</div>
    <p class="muted" style="font-variant-numeric:tabular-nums">Mopped ${g.swept} of ${L.target}${win&&tip?` · ${gbp(tip)} tip for being quick`:''}${newBest?' · <b style="color:var(--cash)">new best</b>':''}</p>
    ${win&&!last?`<button id="next">Next stair: ${esc(LEVELS[g.i+1].name)}</button>`:''}
    <button class="${win?'ghost':''}" id="retry">${win?'Mop it again':'Try again'}</button>
    <button class="ghost" id="home">${last&&win?'Back to the top':'Pick another stair'}</button>
  </div>`;
  o.classList.add('on');
  const nx=o.querySelector('#next');if(nx)nx.onclick=()=>mixScreen(g.i+1);
  o.querySelector('#retry').onclick=()=>mixScreen(g.i);
  o.querySelector('#home').onclick=levels;
}

// ---------- boot ----------
function start(){home();}
window.claude?.hot?.ready?window.claude.hot.ready(start):start();
</script>
