<style>
/* Layout: one-screen phone app. Edinburgh close — sandstone stair, bottle-green tiled walls, brass nameplates. Single deliberate look. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --stone:#c9b89a; --stone-deep:#8f7f63; --tile:#1f4d3a; --tile-deep:#143327;
  --cream:#f3ecdb; --ink:#1c1813; --brass:#d4a645; --red:#d9483a; --muck:#5a4630; --cash:#3fa66b;
  --display:'Alfa Slab One', 'Rockwell', 'Georgia', serif;
  --body:'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{margin:0;background:var(--tile-deep);color:var(--cream);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
.screen{display:flex;flex-direction:column;gap:14px;height:100%;min-height:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,11vw,3.6rem);line-height:.95;margin:0;color:var(--brass);text-shadow:0 3px 0 var(--tile-deep),0 4px 0 #000;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;color:var(--brass);text-wrap:balance}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-weight:700}
p{margin:0;line-height:1.45}
.muted{color:var(--stone);font-size:.9rem}
button{font:inherit;font-weight:900;border:0;border-radius:6px;padding:14px 18px;cursor:pointer;color:var(--ink);background:var(--brass);box-shadow:0 3px 0 #7a5a1c;font-size:1.05rem}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5a1c}
button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
button.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--stone-deep)}
button.ghost:active{box-shadow:inset 0 0 0 2px var(--stone-deep)}
button.sm{padding:10px 14px;font-size:.95rem}
button:disabled{opacity:.45;cursor:default}
.plate{background:var(--tile);border:2px solid var(--stone-deep);border-radius:8px;padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.scroll{overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.av{width:64px;height:64px;border-radius:50%;background:var(--stone);background-size:cover;background-position:center;border:3px solid var(--cream);display:grid;place-items:center;font-size:1.8rem;flex:none}
.crew{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.crew .av{width:44px;height:44px;border-width:2px}
.lbav{width:40px;height:40px;border-radius:50%;background:var(--stone);background-size:cover;background-position:center;border:2px solid var(--cream);display:grid;place-items:center;font-size:1.1rem;flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.card{background:var(--tile);border:2px solid var(--stone-deep);border-radius:8px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--cream);box-shadow:none;font-weight:700;font-size:.9rem}
.card.sel{border-color:var(--brass);background:#2a6349}
.card small{color:var(--stone);font-weight:500;font-size:.75rem}
.lvl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;padding:12px 14px;background:var(--tile);color:var(--cream);box-shadow:none;border:2px solid var(--stone-deep);border-radius:8px}
.lvl b{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--brass)}
.lvl.lock{opacity:.5}
.lvl.special{border-color:var(--brass);background:#2a4a3a}
.lvl .best{grid-row:span 2;font-variant-numeric:tabular-nums;color:var(--cash);font-weight:900;font-size:.95rem;text-align:right}
input[type=text]{font:inherit;font-size:1rem;padding:12px;border-radius:6px;border:2px solid var(--stone-deep);background:var(--tile-deep);color:var(--cream);width:100%;box-sizing:border-box}
input[type=text]:focus-visible{outline:3px solid var(--brass);outline-offset:1px}
label.file{display:flex;align-items:center;gap:12px;cursor:pointer}
label.file input{position:absolute;opacity:0;width:1px;height:1px}
label.file .prev{width:72px;height:72px;border-radius:50%;background:var(--stone);background-size:cover;background-position:center;border:3px solid var(--cream);display:grid;place-items:center;font-size:2rem;flex:none}
.faces{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.face{aspect-ratio:1;max-width:100%;padding:0;border-radius:50%;background-size:cover;background-position:center;border:3px solid var(--stone-deep);box-shadow:none}
.face.sel{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass)}
label.file span.btn{display:inline-block;background:var(--brass);color:var(--ink);padding:10px 14px;border-radius:6px;font-weight:900;box-shadow:0 3px 0 #7a5a1c}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:.72rem;font-weight:700}
.legend div{background:var(--tile-deep);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}
.legend .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem}
.ic.mop{background:#7a6240}
.ic.dodge{box-shadow:0 0 0 3px var(--red);background:#2b1d1a}
.ic.cash{box-shadow:0 0 0 3px var(--cash);background:#163a28}
.ic.pow{box-shadow:0 0 0 3px var(--brass);background:#3a2e14}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:8px 6px;font-size:.85rem}
.tabs button.on{background:var(--brass);color:var(--ink);box-shadow:0 3px 0 #7a5a1c}
#game{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#cv{width:100%;flex:1;min-height:0;border-radius:8px;border:3px solid var(--stone-deep);display:block;touch-action:none;background:var(--stone)}
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:6px 2px;font-variant-numeric:tabular-nums}
#hud .t{font-family:var(--display);font-size:2rem;color:var(--brass);text-align:center;line-height:1}
#hud .t.low{color:var(--red)}
#hud .t.frozen{color:#8fc3ff}
#hud .l{font-size:.85rem;line-height:1.3}
#hud .r{text-align:right;font-size:.85rem;line-height:1.3}
#hud .cash{color:var(--cash);font-weight:900;font-size:1.25rem}
#pow{position:absolute;top:8px;left:0;right:0;text-align:center;font-weight:900;color:var(--brass);text-shadow:0 1px 0 #000;pointer-events:none;font-size:.95rem}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(20,51,39,.82);border-radius:8px;overflow-y:auto}
#over.on{display:flex}
#over .plate{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;text-align:center;margin:auto}
.big{font-family:var(--display);font-size:2.3rem;color:var(--brass);line-height:1}
.money{font-family:var(--display);font-size:3rem;color:var(--cash);line-height:1;font-variant-numeric:tabular-nums}
.taunt{font-style:italic;color:var(--stone)}
.hint{text-align:center;color:var(--stone);font-size:.8rem}
#mixcv{width:100%;flex:1;min-height:0;border-radius:8px;border:3px solid var(--stone-deep);display:block;touch-action:none;background:#2e2a24}
.step{font-weight:900;text-align:center;font-size:1.05rem}
#shareimg{max-width:100%;border-radius:8px;border:2px solid var(--stone-deep)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

async function lbFetch(force){if(!force&&LB_CACHE&&Date.now()-LB_AT<20000)return LB_CACHE;const r=await fetch(LB_URL+'?select=device_id,player,level,money,face,photo,day&order=money.desc&limit=2000',{headers:LB_H});if(!r.ok)throw new Error(r.status);LB_CACHE=await r.json();LB_AT=Date.now();return LB_CACHE;}
// group rows → players for a mode: 'stairs' (sum of levels 0-9), 'daily' (today), 'endless'
function lbPlayers(rows,mode){const mine=deviceId(),byP={};
  for(const r of rows){
    if(mode==='stairs'&&r.level>=LVL_DAILY)continue;if(mode==='daily'&&!(r.level===LVL_DAILY&&r.day===todayKey()))continue;if(mode==='endless'&&r.level!==LVL_ENDLESS)continue;
    const k=r.device_id+'|'+r.player;const o=byP[k]||(byP[k]={name:r.player,mine:r.device_id===mine,best:{},face:-1});
    o.best[r.level]=Math.max(o.best[r.level]||0,r.money);if(r.face!=null&&r.face>=0)o.face=r.face;if(r.photo)o.photo=r.photo;}
  return Object.values(byP).map(o=>({...o,total:Object.values(o.best).reduce((a,b)=>a+b,0),stairs:Object.keys(o.best).length})).sort((a,b)=>b.total-a.total);}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function tone(f,d,type,vol,slide,when){const c=ac();if(!c||MUTED)return;const t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,vol,lo,hi,when){const c=ac();if(!c||MUTED)return;const t=c.currentTime+(when||0),n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(lo,t);f.frequency.exponentialRampToValueAtTime(hi,t+d);f.Q.value=.8;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+d);}

function rate(){
  const f=M.fluid,w=M.fluid+M.water,fOk=f>=.18&&f<=.28,wOk=w>=.82&&w<=.95;let r;
  if(fOk&&wOk)r={label:'Perfect mix',mult:1.5,msg:'Customers pay a wee bit extra for that.'};
  else if((fOk||wOk)&&w>=.6&&f>=.08)r={label:'Decent mix',mult:1,msg:'That’ll get the job done.'};
  else if(f>.28&&w>=.6)r={label:'Too strong',mult:.75,msg:'Whole stair stinks of bleach. Pay docked.'};
  else r={label:'Weak as dishwater',mult:.5,msg:'The muck’s laughing at you. Pay docked.'};
  M.rating=r;
  app.querySelector('#stepTxt').innerHTML=`<span style="color:var(--brass)">${r.label}</span> — ${r.msg} Pay ×${r.mult}`;
  const go=app.querySelector('#go');go.disabled=false;go.textContent='Right, mop it';const run=M.run;go.onclick=()=>startLevel(run,r);
  app.querySelector('#back').textContent='Remix';app.querySelector('#back').onclick=()=>mixScreen(run);
  if(fOk&&wOk)SFX.mixgood();else SFX.mixbad();
}
function mixTick(now){
  if(!M)return;const m=M,dt=Math.min(.05,(now-m.last)/1000);m.last=now;
  if(m.hold){m.pourT=(m.pourT||0)-dt;if(m.pourT<=0){SFX.pour();m.pourT=.1;}if(m.stage===0)m.fluid=Math.min(1,m.fluid+.28*dt);else if(m.stage===1)m.water=Math.min(1-m.fluid,m.water+.45*dt);}
  m.swirl+=dt;
  const cv=m.cv,dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const ctx=m.ctx;ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#2e2a24';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.06)';for(let y=H*.75;y<H;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const bw=Math.min(W*.5,220),bh=Math.min(H*.55,300),bx=W/2,top=H*.22,bot=top+bh;
  const lx=t=>bx-bw/2*(1-.12*t),rx=t=>bx+bw/2*(1-.12*t);
  const total=m.fluid+m.water;
  function fillBand(from,to,col){if(to<=from)return;const y1=bot-bh*to,y2=bot-bh*from;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(lx(to),y1);ctx.lineTo(rx(to),y1);ctx.lineTo(rx(from),y2);ctx.lineTo(lx(from),y2);ctx.closePath();ctx.fill();}
  if(m.stage<2){fillBand(0,m.fluid,'#2fa39a');fillBand(m.fluid,total,'#5b9be0');}
  else{const mixc=m.rating.mult>=1.5?'#4ec3b9':m.rating.mult>=1?'#5aa6c9':m.rating.mult>=.75?'#1f8f85':'#8fb5d8';fillBand(0,total,mixc);
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;for(let k=0;k<3;k++){ctx.beginPath();for(let a=0;a<Math.PI*2;a+=.2){const r=bw*.18*(k+1)/3;ctx.lineTo(bx+Math.cos(a+m.swirl*2+k)*r,bot-bh*total*.5+Math.sin(a+m.swirl*2+k)*r*.3);}ctx.closePath();ctx.stroke();}}
  if(total>0){ctx.fillStyle='rgba(255,255,255,.35)';for(let k=0;k<8;k++){const ph=(m.swirl*.4+k*.37)%1;ctx.beginPath();ctx.arc(bx+Math.sin(k*2.1)*bw*.3,bot-bh*total*ph,2+k%3,0,7);ctx.fill();}}
  ctx.strokeStyle='#c9c9c9';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(lx(1),top);ctx.lineTo(lx(0),bot);ctx.lineTo(rx(0),bot);ctx.lineTo(rx(1),top);ctx.stroke();
  ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(bx,top,bw/2,10,0,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#9a9a9a';ctx.lineWidth=5;ctx.beginPath();ctx.arc(bx,top,bw/2+6,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
  const band=(a,b,col,label)=>{const y1=bot-bh*b,y2=bot-bh*a;ctx.fillStyle=col;ctx.fillRect(rx(1)+14,y1,10,y2-y1);ctx.fillStyle='#f3ecdb';ctx.font='700 12px Nunito, sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(label,rx(1)+30,(y1+y2)/2);};
  band(.18,.28,'rgba(63,166,107,.9)','fluid');band(.82,.95,'rgba(143,195,255,.9)','water line');
  if(m.hold&&m.stage<2){const col=m.stage===0?'#2fa39a':'#5b9be0';ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(bx-8,top-14);ctx.lineTo(bx+8,top-14);ctx.lineTo(bx+3,bot-bh*total);ctx.lineTo(bx-3,bot-bh*total);ctx.closePath();ctx.fill();
    ctx.font='40px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';ctx.textAlign='center';ctx.fillText(m.stage===0?'🧴':'🚰',bx+bw*.45,top-40);}
  ctx.fillStyle='#f3ecdb';ctx.font='900 14px Nunito, sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText(`Fluid ${Math.round(m.fluid*100)}%  ·  Water ${Math.round(m.water*100)}%`,W/2,bot+34);
  raf=requestAnimationFrame(mixTick);
}

// ---------- GAME ----------
let G=null,raf=0;
function stopGame(){if(raf)cancelAnimationFrame(raf);raf=0;G=null;M=null;window.onkeydown=null;}

function startLevel(run,mix){
  stopGame();
  const me=cur();mix=mix||{label:'Decent mix',mult:1};
  const L=run.kind==='endless'?ENDLESS:LEVELS[run.i];
  const endless=run.kind==='endless',daily=run.kind==='daily';
  const time=daily?60:L.time,target=daily||endless?0:L.target;
  const rnd=daily?mulberry(dayNum()*7919+run.i):Math.random;
  app.innerHTML=`<div class="screen" style="gap:6px">
    <div id="hud"><div class="l"><b style="color:var(--brass)">${daily?'Today: ':''}${esc(L.name)}</b><br><span id="lives"></span></div><div class="t" id="time"></div><div class="r"><span class="cash" id="cash">£0</span><br>${target?`mopped <b id="swept"></b>/${target}`:`mopped <b id="swept"></b>`}</div></div>
    <div id="game"><canvas id="cv"></canvas><div id="pow"></div><div id="over"></div></div>
  </div>`;
  const cv=app.querySelector('#cv'),ctx=cv.getContext('2d');
  const photo=new Image();if(me.photo)photo.src=me.photo;
  const names=[...new Set([...S.players.map(p=>p.name.toUpperCase()),...SURNAMES])];
  G={run,L,me,cv,ctx,photo,mix,rnd,endless,daily,target,lane:1,x:0,t:time,el:0,swept:0,cash:0,lives:3,objs:[],parts:[],wet:[],toasts:[],spawnT:0,inv:0,last:0,done:false,steps:0,plateScroll:0,shake:0,mop:0,freeze:0,bigmop:0,wobble:0,names,
     hud:{time:app.querySelector('#time'),swept:app.querySelector('#swept'),lives:app.querySelector('#lives'),cash:app.querySelector('#cash'),pow:app.querySelector('#pow')}};
  let sx=null;
  cv.onpointerdown=e=>{sx=e.clientX;ac();};
  cv.onpointerup=e=>{if(sx===null||!G||G.done)return;const dx=e.clientX-sx;if(Math.abs(dx)>24)move(dx>0?1:-1);else move(e.clientX<cv.getBoundingClientRect().left+cv.clientWidth/2?-1:1);sx=null;};
  window.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);};
  function move(d){if(!G||G.done)return;G.lane=Math.max(0,Math.min(2,G.lane+d));SFX.lane();}
  G.last=performance.now();
  raf=requestAnimationFrame(tick);
}
function pick(list,rnd){const tot=list.reduce((a,c)=>a+c.w,0);let r=rnd()*tot;for(const c of list){r-=c.w;if(r<=0)return c;}return list[0];}

function tick(now){
  if(!G)return;
  const g=G,L=g.L,dt=Math.min(.05,(now-g.last)/1000);g.last=now;
  const cv=g.cv,dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const ctx=g.ctx;ctx.setTransform(dpr,0,0,dpr,0,0);
  const wall=Math.max(28,W*.1),laneW=(W-wall*2)/3,laneX=l=>wall+laneW*(l+.5),py=H*.78;
  const speed=g.endless?L.speed+g.el*11:L.speed,spawn=g.endless?Math.max(.3,L.spawn-g.el*.02):L.spawn;

  if(!g.done){
    g.el+=dt;
    if(g.freeze<=0&&!g.endless){const tb=Math.ceil(g.t);g.t-=dt;if(g.t<10&&g.t>0&&Math.ceil(g.t)<tb)SFX.tick();}
    g.freeze=Math.max(0,g.freeze-dt);g.bigmop=Math.max(0,g.bigmop-dt);g.wobble=Math.max(0,g.wobble-dt);
    g.steps=(g.steps+speed*dt)%56;g.plateScroll=(g.plateScroll+speed*dt)%320;g.spawnT-=dt;g.inv=Math.max(0,g.inv-dt);g.shake=Math.max(0,g.shake-dt);g.mop=Math.max(0,g.mop-dt);
    if(g.spawnT<=0){g.spawnT=spawn*(0.7+g.rnd()*.6);const r=g.rnd(),lane=Math.floor(g.rnd()*3);
      if(r<.13){const c=pick(CUSTOMERS.map(c=>({...c,w:c.v>=20?.8:c.v>=15?.6:c.v>=10?1.2:1.4})),g.rnd);g.objs.push({k:c.k,v:c.v,lane,y:-40,cash:true,who:c.names[Math.floor(g.rnd()*c.names.length)]});}
      else if(r<.16){const p=pick(POWERS,g.rnd);g.objs.push({k:p.k,pow:p,lane,y:-40});}
      else if(r<.47){const blocked=g.objs.filter(o=>o.bad&&o.y<40).length;if(blocked<2)g.objs.push({k:L.obs[Math.floor(g.rnd()*L.obs.length)],lane,y:-40,bad:true});}
      else g.objs.push({lane,y:-40,dirt:true,seed:g.rnd()});
    }
    for(const o of g.objs){o.y+=speed*dt;
      const inLane=o.lane===g.lane||(g.bigmop>0&&o.dirt);
      if(!o.hit&&inLane&&Math.abs(o.y-py)<30){
        if(o.dirt){o.hit=true;g.swept++;g.mop=.35;SFX.mop();puff(laneX(o.lane),py,'#7a6240');g.wet.push({lane:o.lane,y:o.y});}
        else if(o.cash){o.hit=true;const v=Math.round(o.v*g.mix.mult);g.cash+=v;SFX.customer();puff(laneX(o.lane),py,'#3fa66b');g.toasts.push({x:laneX(o.lane),y:py-50,txt:o.who+' · +'+gbp(v),life:1.4,c:'#3fa66b'});}
        else if(o.pow){o.hit=true;SFX.power();puff(laneX(o.lane),py,'#d4a645');const p=o.pow;
          if(p.k==='🫖')g.freeze=5;else if(p.k==='🧽')g.bigmop=5;else{g.cash+=15;g.wobble=4;}
          g.toasts.push({x:laneX(o.lane),y:py-50,txt:p.name+(p.k==='🥃'?' · +£15':''),life:1.4,c:'#d4a645'});}
        else if(o.bad&&g.inv<=0){o.hit=true;g.lives--;g.inv=1.3;g.shake=.3;SFX.bump();}
      }}
    g.objs=g.objs.filter(o=>o.y<H+60&&!(o.hit&&!o.bad));

    for(const p of g.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt;}g.parts=g.parts.filter(p=>p.life>0);
    for(const t of g.toasts){t.y-=30*dt;t.life-=dt;}g.toasts=g.toasts.filter(t=>t.life>0);
    if(g.target&&g.swept>=g.target)finish(true);else if(g.lives<=0)finish(g.endless||g.daily);else if(!g.endless&&g.t<=0)finish(g.daily);
  }

  // ---- draw ----

  if(g.shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  if(g.wobble>0){ctx.translate(W/2,H/2);ctx.rotate(Math.sin(now/180)*.04*Math.min(1,g.wobble));ctx.translate(-W/2,-H/2);}
  ctx.fillStyle=L.stone;ctx.fillRect(-20,-20,W+40,H+40);
  for(let y=-56+g.steps;y<H+56;y+=56){
    ctx.fillStyle='rgba(0,0,0,.10)';ctx.fillRect(wall,y,W-wall*2,8);
    ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(wall,y+8,W-wall*2,3);
    ctx.fillStyle='rgba(0,0,0,.04)';ctx.fillRect(wall,y+30,W-wall*2,26);
  }
  for(const w of g.wet){const x=laneX(w.lane);ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(x,w.y,laneW*.42,22,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(120,170,220,.5)';ctx.lineWidth=2;for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(x-laneW*.3,w.y+k*9);ctx.quadraticCurveTo(x,w.y+k*9-6,x+laneW*.3,w.y+k*9);ctx.stroke();}
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✦',x+laneW*.28,w.y-10);}
  if(g.bigmop>0){ctx.fillStyle='rgba(212,166,69,.10)';ctx.fillRect(wall,0,W-wall*2,H);}
  ctx.strokeStyle='rgba(0,0,0,.07)';ctx.setLineDash([6,10]);ctx.lineWidth=1;for(let l=1;l<3;l++){ctx.beginPath();ctx.moveTo(wall+laneW*l,0);ctx.lineTo(wall+laneW*l,H);ctx.stroke();}ctx.setLineDash([]);
  // tenement walls: tiles to dado height, painted above, brass nameplates by each door
  ctx.fillStyle=L.wall;ctx.fillRect(-20,-20,wall+20,H+40);ctx.fillRect(W-wall,-20,wall+20,H+40);
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;for(let y=-20+g.steps%20;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(wall,y);ctx.moveTo(W-wall,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,0,wall*.35,H);ctx.fillRect(W-wall*.35,0,wall*.35,H);
  for(let k=-1;k<Math.ceil(H/320)+1;k++){const y=k*320+g.plateScroll-40;const side=(k%2===0)?0:1;const px=side?W-wall+4:4,pw=wall-8;
    ctx.fillStyle='#3b2a14';ctx.fillRect(px,y-30,pw,70);ctx.fillStyle='#5a3d1e';ctx.fillRect(px+2,y-28,pw-4,66);
    ctx.fillStyle='#d4a645';ctx.fillRect(px+3,y-6,pw-6,14);ctx.fillStyle='#1c1813';ctx.font='900 '+Math.max(7,Math.min(10,pw/4.2))+'px Nunito, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const nm=g.names[(Math.abs(k)+side)%g.names.length];ctx.save();ctx.beginPath();ctx.rect(px+3,y-6,pw-6,14);ctx.clip();ctx.fillText(nm,px+pw/2,y+1);ctx.restore();}
  ctx.fillStyle='#6b4a2a';ctx.fillRect(wall-6,0,6,H);ctx.fillRect(W-wall,0,6,H);
  // objects
  ctx.textAlign='center';ctx.textBaseline='middle';
  const EM='px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
  for(const o of g.objs){const x=laneX(o.lane);
    if(o.dirt){ctx.fillStyle='#5a4630';ctx.globalAlpha=.9;ctx.beginPath();for(let a=0;a<8;a++){const ang=a/8*Math.PI*2,r=16+Math.sin(o.seed*9+a*3)*5;ctx.lineTo(x+Math.cos(ang)*r*1.5,o.y+Math.sin(ang)*r*.7);}ctx.closePath();ctx.fill();
      ctx.fillStyle='#3b2c1c';ctx.beginPath();ctx.arc(x-8,o.y-2,4,0,7);ctx.arc(x+7,o.y+4,3,0,7);ctx.fill();ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(90,70,48,.6)';ctx.lineWidth=1.5;for(let k=0;k<3;k++){const wx=x-10+k*10,ph=Math.sin(now/300+k);ctx.beginPath();ctx.moveTo(wx,o.y-12);ctx.quadraticCurveTo(wx+4*ph,o.y-20,wx,o.y-28);ctx.stroke();}
    }else if(o.bad){ctx.fillStyle='rgba(217,72,58,.18)';ctx.beginPath();ctx.arc(x,o.y,28,0,7);ctx.fill();ctx.strokeStyle='#d9483a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,o.y,28,0,7);ctx.stroke();ctx.font='32'+EM;ctx.fillText(o.k,x,o.y+1);
    }else if(o.cash){ctx.fillStyle='rgba(63,166,107,.25)';ctx.beginPath();ctx.arc(x,o.y,27,0,7);ctx.fill();ctx.strokeStyle='#3fa66b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,o.y,27,0,7);ctx.stroke();ctx.font='30'+EM;ctx.fillText(o.k,x,o.y+1);
      ctx.fillStyle='#163a28';ctx.fillRect(x-20,o.y+30,40,16);ctx.fillStyle='#f3ecdb';ctx.font='900 12px Nunito, sans-serif';ctx.fillText(gbp(o.v),x,o.y+38);
    }else if(o.pow){ctx.fillStyle='rgba(212,166,69,.25)';ctx.beginPath();ctx.arc(x,o.y,26,0,7);ctx.fill();ctx.strokeStyle='#d4a645';ctx.lineWidth=3;ctx.setLineDash([5,4]);ctx.lineDashOffset=-now/40;ctx.beginPath();ctx.arc(x,o.y,26,0,7);ctx.stroke();ctx.setLineDash([]);ctx.font='28'+EM;ctx.fillText(o.k,x,o.y+1);}

}
function puff(x,y,c){for(let i=0;i<10;i++)G.parts.push({x,y,vx:(Math.random()-.5)*220,vy:-Math.random()*220,life:.5,c});}

function drawPlayer(ctx,x,y,img,hasPhoto,mop,wide){
  const swing=mop>0?Math.sin((0.35-mop)/0.35*Math.PI)*1.1:0;
  ctx.save();ctx.translate(x+14,y-6);ctx.rotate(0.5-swing);
  ctx.strokeStyle='#8b5a2b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,46);ctx.stroke();
  const hw=wide?Math.min(wide*.3,60):10;
  ctx.fillStyle=wide?'#d4a645':'#e8e2d2';ctx.beginPath();ctx.moveTo(-hw,42);ctx.lineTo(hw,42);ctx.lineTo(hw+3,58);ctx.lineTo(-hw-3,58);ctx.closePath();ctx.fill();
  ctx.strokeStyle=wide?'#a67a2a':'#cfc6b2';ctx.lineWidth=1.5;for(let k=-hw+1;k<=hw-1;k+=3){ctx.beginPath();ctx.moveTo(k,44);ctx.lineTo(k*1.15,58);ctx.stroke();}
  ctx.restore();
  ctx.fillStyle='#1b2a44';ctx.fillRect(x-12,y+24,9,16);ctx.fillRect(x+3,y+24,9,16);
  ctx.fillStyle='#2a4b8d';ctx.beginPath();ctx.moveTo(x-16,y-2);ctx.lineTo(x+16,y-2);ctx.lineTo(x+14,y+28);ctx.lineTo(x-14,y+28);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e4b23a';ctx.fillRect(x-16,y+8,32,5);
  const r=24,hy=y-22;
  ctx.save();ctx.beginPath();ctx.arc(x,hy,r,0,Math.PI*2);ctx.closePath();ctx.fillStyle='#f0c9a0';ctx.fill();ctx.clip();

  else{ctx.fillStyle='#1c1813';ctx.beginPath();ctx.arc(x-8,hy-4,2.5,0,7);ctx.arc(x+8,hy-4,2.5,0,7);ctx.fill();ctx.strokeStyle='#1c1813';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,hy+4,8,.2,Math.PI-.2);ctx.stroke();}
  ctx.restore();
  ctx.strokeStyle='#f3ecdb';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,hy,r,0,Math.PI*2);ctx.stroke();
}

// ---------- END OF RUN ----------
function finish(win){
  const g=G,me=g.me,L=g.L,run=g.run;g.done=true;
  const tip=(win&&!g.endless&&!g.daily)?Math.ceil(g.t):0;
  const total=g.cash+tip;
  let newBest=false,label='',mode='stairs';
  if(g.endless){mode='endless';if(!me.endless||total>me.endless){me.endless=total;newBest=true;}lbPush(me,LVL_ENDLESS,Math.max(me.endless,total));label='The Scotsman Steps · '+Math.floor(g.el)+'s';}
  else if(g.daily){mode='daily';const d=todayKey();if(!me.daily||me.daily.day!==d||total>me.daily.money){me.daily={day:d,money:total};newBest=true;}lbPush(me,LVL_DAILY,me.daily.money,d);label='Today’s stair · '+L.name;}
  else if(win){if(!me.best[run.i]||total>me.best[run.i]){me.best[run.i]=total;newBest=true;}me.unlocked=Math.max(me.unlocked,Math.min(LEVELS.length,run.i+2));lbPush(me,run.i,me.best[run.i]);label=L.name;}
  else label=L.name;
  save();
  if(win)SFX.win();else SFX.fail();
  const last=!g.endless&&!g.daily&&run.i===LEVELS.length-1;
  const lines=win?(g.endless?['Ye fell off the Scotsman Steps.','The steps always win in the end.']:['Aye, that’ll do.','Stair’s gleaming.','Ya dancer!','No bad at all.']):[g.lives<=0?'Ach, ye got flattened.':'Time’s up, hen.','The neighbours are no happy.'];
  const o=app.querySelector('#over');
  o.innerHTML=`<div class="plate">
    <div class="eyebrow">${esc(label)} · ${esc(g.mix.label)}</div>
    <div class="big">${win?(g.endless?'Stair heid?':last?'Stair heid!':'Clean!'):'Back up ye go'}</div>
    <p>${lines[Math.floor(Math.random()*lines.length)]}</p>
    <div class="eyebrow">${win?'Collected':'Collected before ye stopped'}</div>
    <div class="money">${gbp(win?total:g.cash)}</div>
    <p class="muted" style="font-variant-numeric:tabular-nums">Mopped ${g.swept}${g.target?' of '+g.target:''}${tip?` · ${gbp(tip)} tip for being quick`:''}${newBest?' · <b style="color:var(--cash)">new best</b>':''}</p>
    <p class="taunt" id="taunt"></p>
    <div class="row" style="justify-content:center">${win?`<button class="ghost sm" id="share">Share</button>`:''}</div>
    ${win&&!last&&!g.endless&&!g.daily?`<button id="next">Next stair: ${esc(LEVELS[run.i+1].name)}</button>`:''}
    <button class="${win?'ghost':''}" id="retry">${win?'Again':'Try again'}</button>
    <button class="ghost" id="home">Pick another stair</button>
  </div>`;
  o.classList.add('on');
  const nx=o.querySelector('#next');if(nx)nx.onclick=()=>mixScreen({kind:'stair',i:run.i+1});
  o.querySelector('#retry').onclick=()=>mixScreen(run);
  o.querySelector('#home').onclick=levels;
  const sh=o.querySelector('#share');if(sh)sh.onclick=()=>shareCard(me,label,win?total:g.cash,g.endless?Math.floor(g.el):null);
  taunt(me,mode,win?total:g.cash);
}
async function taunt(me,mode,money){
  const el=app.querySelector('#taunt');if(!el)return;
  try{const rows=await lbFetch(true),players=lbPlayers(rows,mode),mine=deviceId();
    const idx=players.findIndex(p=>p.mine&&p.name===me.name);const meRow=idx>=0?players[idx]:null;const above=idx>0?players[idx-1]:null;const first=players[0];
    const pick=a=>a[Math.floor(Math.random()*a.length)];
    if(!el.isConnected)return;
    if(meRow&&idx===0&&players.length>1){el.textContent=pick([`Top o’ the stair. ${players[1].name} is ${gbp(meRow.total-players[1].total)} behind ye.`,`Nobody’s touching ye. ${players[1].name}’s ${gbp(meRow.total-players[1].total)} back.`]);}
    else if(above&&meRow){const gap=above.total-meRow.total;el.textContent=pick([`${above.name}’s still ${gbp(gap)} ahead. Back up they stairs.`,`${gbp(gap)} short o’ ${above.name}. The mop’s no going to hold itself.`,`${above.name} is laughing. ${gbp(gap)} to catch them.`]);}
    else if(first&&!meRow){el.textContent=`${first.name}’s top wi’ ${gbp(first.total)}. Post a score and get on the board.`;}
  }catch(e){}
}

// ---------- SHARE CARD (for WhatsApp) ----------
function shareCard(me,label,money,secs){
  const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');
  x.fillStyle='#1f4d3a';x.fillRect(0,0,1080,1350);
  x.fillStyle='#c9b89a';x.fillRect(180,0,720,1350);
  for(let y=0;y<1350;y+=120){x.fillStyle='rgba(0,0,0,.10)';x.fillRect(180,y,720,18);x.fillStyle='rgba(255,255,255,.18)';x.fillRect(180,y+18,720,6);}
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=2;for(let y=0;y<1350;y+=40){x.beginPath();x.moveTo(0,y);x.lineTo(180,y);x.moveTo(900,y);x.lineTo(1080,y);x.stroke();}
  x.fillStyle='rgba(20,51,39,.92)';x.fillRect(120,120,840,1110);x.strokeStyle='#8f7f63';x.lineWidth=6;x.strokeRect(120,120,840,1110);
  x.textAlign='center';x.fillStyle='#c9b89a';x.font='700 30px Nunito, sans-serif';x.fillText('AN EDINBURGH STAIR-CLEANING GAME',540,200);
  x.fillStyle='#d4a645';x.font='400 96px "Alfa Slab One", Rockwell, Georgia, serif';x.fillText('Stair Cleaning',540,300);
  const done=()=>{
    x.fillStyle='#f3ecdb';x.font='900 56px Nunito, sans-serif';x.fillText(me.name,540,760);
    x.fillStyle='#c9b89a';x.font='700 34px Nunito, sans-serif';x.fillText(label,540,815);
    x.fillStyle='#3fa66b';x.font='400 170px "Alfa Slab One", Rockwell, Georgia, serif';x.fillText(gbp(money),540,990);
    x.fillStyle='#f3ecdb';x.font='700 36px Nunito, sans-serif';x.fillText(secs!=null?`Lasted ${secs}s on the steps. Beat that.`:'Collected fae the neighbours. Beat that.',540,1060);
    x.fillStyle='#d4a645';x.fillRect(300,1120,480,70);x.fillStyle='#1c1813';x.font='900 32px Nunito, sans-serif';x.fillText(SITE,540,1167);
    c.toBlob(async b=>{const file=new File([b],'stair-cleaning.jpg',{type:'image/jpeg'});
      try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Stair Cleaning',text:`${me.name} collected ${gbp(money)} on ${label}. https://${SITE}`});return;}}catch(e){}
      showShareFallback(c.toDataURL('image/jpeg',.9));},'image/jpeg',.9);};
  x.save();x.beginPath();x.arc(540,540,150,0,7);x.closePath();x.fillStyle='#f0c9a0';x.fill();x.clip();
  if(me.photo){const im=new Image();im.onload=()=>{x.drawImage(im,390,390,300,300);x.restore();ring();done();};im.onerror=()=>{x.restore();ring();done();};im.src=me.photo;}else{x.restore();ring();done();}
  function ring(){x.strokeStyle='#f3ecdb';x.lineWidth=12;x.beginPath();x.arc(540,540,150,0,7);x.stroke();}
}
function showShareFallback(url){
  const o=app.querySelector('#over');if(!o)return;
  o.innerHTML=`<div class="plate"><div class="eyebrow">Your card</div><img id="shareimg" src="${url}" alt="Share card"><p class="muted">Press and hold the picture to save or send it.</p><button class="ghost" id="cl">Back</button></div>`;
  o.querySelector('#cl').onclick=levels;
}

// ---------- boot ----------
function start(){home();lbSyncAll();}
window.claude?.hot?.ready?window.claude.hot.ready(start):start();
</script>
